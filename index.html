<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interstitial Journal</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <nav class="app-nav">
    <button id="nav-things" class="nav-button active" type="button">Things</button>
    <button id="nav-review" class="nav-button" type="button">Review</button>
    <button id="nudge-toggle" class="nudge-toggle" type="button" aria-pressed="false">Nudge: off</button>
  </nav>

  <main id="things-view">
    <div id="things-home"></div>
    <div id="thing-detail" hidden></div>
  </main>

  <main id="review-view" hidden>
    <div class="review-controls">
      <input id="search-input" type="search" placeholder="Search entries..." />
      <select id="range-select">
        <option value="7d">Last 7 days</option>
        <option value="30d">Last 30 days</option>
        <option value="all" selected>All time</option>
      </select>
    </div>
    <div id="entry-list"></div>
  </main>

  <div id="picker" class="picker" hidden>
    <div class="picker-box">
      <input id="picker-input" type="text" placeholder="Which thing?" autocomplete="off" />
      <ul id="picker-list"></ul>
    </div>
  </div>

  <div id="persistence-warning" class="toast" hidden>
    Your entries won't be saved after this session.
  </div>

  <div id="nudge-toast" class="toast" hidden>
    Anything on your mind? <button id="nudge-open" type="button">Jot</button>
  </div>

  <div id="undo-toast" class="toast" hidden>
    <span class="undo-message"></span> <button type="button">Undo</button>
  </div>

  <div id="update-toast" class="toast" hidden>
    Update ready. <button id="update-button" type="button">Refresh</button>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
