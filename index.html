<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
  <title>Thoughtcrumbs</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">Thoughtcrumbs</span>
    <nav class="topnav" aria-label="Main">
      <button id="nav-things" class="nav-link active" type="button">Today</button>
      <button id="nav-review" class="nav-link" type="button">Search</button>
      <span class="nav-hint" aria-hidden="true">⌘K</span>
      <button id="nudge-toggle" class="nav-link nudge-toggle" type="button" aria-pressed="false">Nudge: off</button>
    </nav>
  </header>

  <div class="layout">
    <main id="things-view" class="page">
      <div id="page"></div>
    </main>

    <main id="review-view" class="page" hidden>
      <header class="page-head">
        <div class="title-row"><h1 class="page-title">Search</h1></div>
        <p class="page-subtitle"><span class="muted">Every note, newest day first</span></p>
      </header>
      <div class="review-controls">
        <input id="search-input" type="search" placeholder="Search notes" aria-label="Search notes" />
        <select id="range-select" aria-label="Date range">
          <option value="7d">Last 7 days</option>
          <option value="30d">Last 30 days</option>
          <option value="all" selected>All time</option>
        </select>
      </div>
      <div id="entry-list"></div>
    </main>

    <aside id="sidebar" class="sidebar" aria-label="Calendar and links">
      <section id="calendar" class="calendar"></section>
      <section id="graph" class="graph"></section>
    </aside>
  </div>

  <div id="picker" class="picker" hidden>
    <div class="picker-box" role="dialog" aria-label="Jump to a thing">
      <input id="picker-input" type="text" placeholder="Jump to a thing" autocomplete="off" />
      <ul id="picker-list"></ul>
    </div>
  </div>

  <div id="persistence-warning" class="toast" hidden>
    Your notes won't be saved after this session.
  </div>

  <div id="nudge-toast" class="toast" hidden>
    Anything on your mind? <button id="nudge-open" type="button">Jot</button>
  </div>

  <div id="undo-toast" class="toast" hidden>
    <span class="undo-message"></span> <button type="button">Undo</button>
  </div>

  <div id="update-toast" class="toast" hidden>
    Update ready. <button id="update-button" type="button">Refresh</button>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
